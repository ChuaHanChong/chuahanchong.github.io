    Projects:
      - name: Learning Self-Supervised Visual Representations for Fine-grained Maritime Vessel Recognition
        summary: MSc dissertation, Nanyang Technological University.
        highlights:
          - Curated over 3.1M vessel images across 21 fine-grained categories via a
            data-sourcing pipeline, deduplicated with a Self-Supervised Copy Detection model.
          - Built supervised Vision Transformer baselines (ViT-B/L/H) and compared
            self-supervised paradigms including MAE, DINOv2, and I-JEPA.
          - Addressed class imbalance with balanced sampling and logit-adjusted loss.
          - Reached 98.82% test accuracy over 17 in-distribution vessel classes and 100% over
            4 out-of-distribution classes, showing self-supervised pre-training generalises
            better than supervised-only baselines.

      - name: Application of the Bees Algorithm to Improve the Performance of Flywheel Energy Storage
        summary: BEng final year project, Universiti Putra Malaysia.
        highlights:
          - Optimised composite flywheel rotor geometry with the Bees Algorithm under the
            Tsai-Hill failure criterion to maximise energy storage while minimising mass.
          - Validated top designs with finite element analysis in ANSYS, improving usable
            energy by 23.5% and reducing rotor mass by 41.5% against the NASA G3 baseline.
