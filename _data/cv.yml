# Single source for both the /cv/ page and the downloadable PDF.
# The PDF is regenerated by .github/workflows/render-cv.yml on every push that
# touches this file, and lands in assets/rendercv/rendercv_output/.
# Format reference: https://docs.rendercv.com/user_guide/yaml_input_structure/
#
# NOTE: RenderCV v2.x rejects the top-level `label`, `image`, `summary`, and `address`
# keys that shipped in the al-folio demo file. They are also unused by the website's
# CV templates, which read `cv.sections` only. Do not add them back - the render-cv
# workflow will fail. The headline text lives in `_pages/cv.md` (description) instead.
#
# The `design:` block below lives here on purpose. RenderCV only reads
# assets/rendercv/design.yaml when invoked with `--design`, and al-folio's stock
# render-cv.yml workflow passes only `--settings` - so that file is silently
# ignored. Design set here is the design that actually ships.
design:
  theme: classic
  colors:
    name: "#0f766e" # matches --global-theme-color on the site
    headline: "#0f766e"
    connections: "#0f766e"
    section_titles: "#0f766e"
    links: "#0f766e"
  page:
    size: a4
    show_footer: false
    show_top_note: false

