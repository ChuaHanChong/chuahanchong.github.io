# Single source for both the /cv/ page and the downloadable PDF.
# The PDF is regenerated by .github/workflows/render-cv.yml on every push that
# touches this file, and lands in assets/rendercv/rendercv_output/.
#
# FORMAT: use al-folio's own section names and entry field names (see the upstream
# demo at https://github.com/alshedivat/al-folio/blob/main/_data/cv.yml). The website
# renders each section with a dedicated Liquid template that reads specific fields:
#
#   Education     institution, area, degree/studyType, start_date, end_date, location, url, courses, highlights
#   Experience    company, position, start_date, end_date, location, url, summary, highlights
#   Awards        title, date, awarder, url, summary
#   Publications  title, name, publisher, date/releaseDate, url, summary
#   Skills        name, level, icon, keywords
#   Interests     name, icon, keywords
#   Certificates  name, date, issuer, icon, url
#   Projects      name, summary, highlights, start_date, end_date, date, url
#
# Section names outside that set fall through to a generic renderer that only handles
# `bullet` and `label` entries, so they render EMPTY on the website even though they
# look correct in the PDF. Verified against al_folio_cv 1.0.2 - an earlier version of
# this file used RenderCV's own `label`/`details` shape and silently produced an empty
# Certificates section and a nameless Award on the live site.
#
# NOTE: RenderCV v2.x rejects the top-level `label`, `image`, `summary`, and `address`
# keys that shipped in the al-folio demo file. Do not add them back - the render-cv
# workflow will fail. Everything below is verified to satisfy both renderers.
#
# The `design:` and `locale:` blocks live here on purpose. RenderCV reads
# assets/rendercv/{design,locale}.yaml only when invoked with --design / --locale, and
# al-folio's stock workflow passes only --settings, so those files are inert.
design:
  theme: classic
  colors:
    name: "#0f766e" # matches --global-theme-color on the site
    headline: "#0f766e"
    connections: "#0f766e"
    section_titles: "#0f766e"
    links: "#0f766e"
  page:
    size: a4
    show_footer: false
    show_top_note: false
  templates:
    education_entry:
      # The stock layout puts `degree` in a 1cm column, which is sized for "PhD"/"MSc"
      # and hyphenates full degree names down the page ("Doc-tor of Phi-loso-phy").
      # Drop that column and fold the degree into the main line instead.
      degree_column: null
      main_column: "**DEGREE**\nINSTITUTION\nSUMMARY\nHIGHLIGHTS"

locale:
  language: english # required discriminator; the locale block is a tagged union
  # Uniform three-letter months. RenderCV's default follows the Yale library
  # cataloguing standard, which mixes 3- and 4-letter forms (June, July, Sept).
  month_abbreviations:
    [Jan, Feb, Mar, Apr, May, Jun, Jul, Aug, Sep, Oct, Nov, Dec]

